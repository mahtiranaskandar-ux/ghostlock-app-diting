# GhostLock adaptation template (6.6).
# Copy this file, fill every null, and register the release/file pair in
# kernel_profiles/index.conf.
# 用途：复制后逐项填写；调试页“加载其他内置配置”可手动加载查看字段结构。
# 步骤：
#   1. 按设备 `uname -r` 替换 release，并把文件重命名为 <release>.conf；
#   2. 填写所有 null（几何/偏移/符号）；删除不可行的 syscall（整块 null）；
#   3. 在 index.conf 的 profiles 数组登记 { release = ..., file = ... }。
#
# 本文件就是 schema v3 文档：devices / kernel / ghostlock / timer 四块。
# **无值写 null，绝不省略键**——固定的键集合是校验的一部分。
# 6.6 的 cred 有四个引用；waiter 是 rt_waiter_node（node）。
#
# 推荐让提取器生成，而不是手填：
#   ghostlock-extract <boot.img> --format conf --anchor --device <codename>
#   （镜像不可得时，才以本模板手工补齐。）
schema_version = 3
# 与设备 uname -r 完全一致（区分大小写与后缀）；发布前替换本模板名。
release = "<uname -r>"

# 每台设备的物理对（load / offset）；未知写 null（按 SoC 规则运行期回退）。
# 无设备条目时整块写 `devices = null`。
devices {
  <codename> {
    phys {
      load = null
      offset = null
    }
  }
}

kernel {
  # Image 的链接基址（_text）。symbols 下的全部地址都是相对它的十六进制偏移。
  image_base = null

  symbols {
    # 十个共享符号（主提取器生成）
    init_task = null
    init_cred = null
    root_task_group = null
    empty_zero_page = null
    selinux_state = null
    selinux_blob_sizes = null
    security_hook_heads = null
    nf_logger = null            # 曾名 offset.slide_nfulnl_logger
    loggers_0_1 = null          # 曾名 offset.slide_loggers_0_1
    boot_id = null              # 曾名 offset.slide_boot_id
    # 定时器引擎的五个符号（timer 分析器生成；非定时器 profile 写 null）
    panic_on_warn = null
    root_user = null
    init_user_ns = null
    init_ucounts = null
    init_groups = null
  }

  struct {
    # task_struct 字段偏移
    task {
      prio = null
      normal_prio = null
      sched_task_group = null
      pi_lock = null
      pi_waiters = null
      pi_top_task = null
      pi_blocked_on = null
      pid = null
      tgid = null
      atomic_flags = null
      real_cred = null
      cred = null
      comm = null
      tasks = null
      seccomp = null
    }

    # 凭据布局。usage 的 offset 可空；value 是写入的 refcount 目标值。
    cred {
      copy_size = null
      usage {
        offset = null
        size = null
        value = null
      }
      uid = null
      security = null
      security_sid = null       # timer 分析器生成
      caps {
        offset = null
        count = null              # 写入 __cap v 的 u64 个数（通常 5）
        mask = null
      }
      # 具名引用：按布局的成员命名，不按位置。
      refs {
        user {
          offset = null
          image = null
        }
        user_ns {
          offset = null
          image = null
        }
        ucounts {
          offset = null          # {ucounts}
          image = null
        }
        group_info {
          offset = null
          image = null
        }
      }
    }

    # rt_mutex_waiter 布局；shape 是 "compact"（5.x/6.1）或 "node"（6.6+）。
    waiter {
      shape = "node"
      pi_tree = null
      task = null
      lock = null
      wake_state = null
    }

    rt_mutex {
      size = null
    }

    selinux_state {
      enforcing = null
      initialized = null
    }
  }

  heap {
    stride = null               # 实测 mm_struct slab 步长（生成时写入；root 实测优先）
    collisions = null
  }
  # DirtyFrag 静态判决：feasible / infeasible / unknown；kdp=true 时只能 dirtyfrag。
  dirtyfrag = null
  kdp = false
}

ghostlock {
  # 选中的 syscall 与 carrier。syscalls 中声明了哪些块，就是该镜像可用的 carrier。
  # 不能用（不可行）的 syscall 整个写 null。
  syscall = null                # select_stack | sigreturn | multicast_waiter | tcp_zerocopy
  carrier = null                # null（原生 64 位）| "compat"（32 位）

  # 锁锚点三元组 + W1 scratch。页面路径不使用锚点时整块写 `anchor = null`。
  anchor {
    image = null
    bytes = null
    stride = null
    scratch = null
  }

  syscalls {
    select_stack {
      native {
        waiter_shift = null
      }
      compat {
        waiter_home = null
        dst_depth = null        # 曾名 select_dst_depth
        futex_abi = "time32"    # "time32" | "time64"
      }
    }
    sigreturn {
      native {
        waiter_off {
          plain = null
          sve = null
        }
      }
      compat = null
    }
    multicast_waiter {
      native {
        waiter_off = null
        buffer_size = null
      }
      compat {
        waiter_off = null
        buffer_size = null
        futex_abi = "time32"
      }
    }
    tcp_zerocopy {
      native {}
      compat = null
    }
  }

  # module 链（与 syscalls 互斥；声明 module 时整个 syscalls 块写 null）：
  # module { asset = "modules/x.ko", sha256 = "…", vendor_files = ["/vendor/lib64/…"] }
  module = null

  # execution 调优由 resolver 从 preset 合并；文档可写差异覆盖，未写整块 null。
  execution = null
}

# 定时器引擎（CVE-2026-98260）：timer 分析器生成的完整块；非定时器 profile 写 null。
timer = null
